server:
  port: ${PORT:8080}

spring:
  application:
    name: lifeos-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lifeos}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: LifeOS-HikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

app:
  version: 1.0.0
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX3NlY3JldF9mb3JfbGlmZW9zX2FwcGxpY2F0aW9uXzI1NmJpdF9rZXk=}
      expiration-ms: ${JWT_EXPIRATION_MS:604800000}
    cookie:
      name: ${AUTH_COOKIE_NAME:lifeos_token}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}

logging:
  level:
    root: INFO
    com.lifeos: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
